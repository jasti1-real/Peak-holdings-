<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b4e"><title>Peak Holdings</title><style>
:root{--n:#102b4e;--g:#16845b;--gold:#d8a84e;--mut:#718096;--line:#e7edf3;--bg:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#182638}button,input{font:inherit}button{cursor:pointer;border:0}.hide{display:none!important}.wrap{max-width:1100px;margin:auto;padding:16px}.brand{font-weight:850;color:var(--n);font-size:21px;display:flex;gap:10px;align-items:center}.logo{background:linear-gradient(135deg,var(--n),var(--g));color:white;border-radius:12px;padding:9px 13px}.panel,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.auth{max-width:420px;margin:7vh auto}h1{font-size:25px;color:var(--n);margin:18px 0 4px}label{display:block;font-size:13px;color:#42556b;margin:12px 0}input{display:block;width:100%;padding:12px;border:1px solid #dce4ed;border-radius:10px;margin-top:5px}.btn{padding:11px 16px;border-radius:10px;font-weight:750}.primary{background:var(--n);color:white}.light{background:#eaf3ef;color:var(--g)}.wide{width:100%;margin-top:8px}.muted{color:var(--mut);font-size:13px}.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}.nav{display:flex;gap:7px;background:white;padding:7px;border:1px solid var(--line);border-radius:13px}.nav button{background:transparent;color:var(--mut);padding:10px 16px;border-radius:9px;font-weight:700}.nav .on{background:var(--n);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{color:var(--mut);font-size:12px}.stat b{display:block;color:var(--n);font-size:22px;margin:5px 0}.actions{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}.invite{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eff8f3;padding:13px;border-radius:12px;color:var(--g);overflow-wrap:anywhere}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.machine{height:105px;background:linear-gradient(135deg,#eaf1f9,#e8f5ee);border-radius:12px;display:grid;place-items:center;color:var(--n);font-size:35px}.price{font-size:20px;font-weight:850;color:var(--n);margin:7px 0}.table{overflow:auto;background:white;border-radius:12px;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:500px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--mut)}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.levels b{display:block;color:var(--g);font-size:22px}.warn{background:#fff6e3;border:1px solid #ead8ad;color:#77581d;padding:11px;border-radius:11px;font-size:12px;margin:12px 0}.bottom{display:none}.small{font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff3d6;color:#77581d;font-size:11px;font-weight:700}.ledger-credit{color:#16845b}.ledger-debit{color:#9d2929}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}.nav{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:white;border-top:1px solid var(--line);padding:8px}.bottom button{background:white;color:var(--mut);font-size:12px}.bottom .on{color:var(--g)}main{padding-bottom:75px}.levels{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><span class="logo">P</span> PEAK HOLDINGS</div><span id="member" class="muted"></span></header>
<section id="auth" class="panel auth"><div id="login"><h1>Welcome back</h1><p class="muted">Log in with your registered phone.</p><label>Telephone number<input id="lp" type="tel" inputmode="tel" placeholder="0771234567 or +256771234567"></label><label>Password<input id="lpass" type="password" autocomplete="current-password"></label><button class="btn primary wide" onclick="submitLogin()">Log in</button><p class="muted">New here? <a href="#" onclick="toggleAuth();return false">Create account</a></p></div><div id="register" class="hide"><h1>Create account</h1><label>Full name<input id="rn"></label><label>Telephone number<input id="rp" type="tel" inputmode="tel" placeholder="0771234567 or +256771234567"></label><label>Password (10+ characters)<input id="rpass" type="password" autocomplete="new-password"></label><label>Referral code (optional)<input id="rr"></label><button class="btn primary wide" onclick="submitRegistration()">Register</button><p class="muted">Already registered? <a href="#" onclick="toggleAuth();return false">Log in</a></p></div><p id="msg" class="muted"></p></section>
<div id="app" class="hide"><nav class="nav" id="nav"></nav><main id="screen"></main></div></div><nav class="bottom" id="bottom"></nav>
<script>
var tabs=[["home","⌂","Home"],["products","▦","Products"],["referrals","♧","Referrals"],["account","◉","Account"]],page="home",user=null;
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "UGX "+Number(n||0).toLocaleString("en-US")}
function message(t){document.getElementById("msg").textContent=t}
function toggleAuth(){var loginPanel=document.getElementById("login");var registerPanel=document.getElementById("register");loginPanel.classList.toggle("hide");registerPanel.classList.toggle("hide");message("");}
async function api(path,data){var r=await fetch("/api/"+path,{method:data?"POST":"GET",headers:data?{"content-type":"application/json"}:{},body:data?JSON.stringify(data):undefined,credentials:"same-origin"});var j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function submitLogin(){try{user=(await api("login",{phone:lp.value.trim(),password:lpass.value})).user;boot()}catch(e){message(e.message)}}
async function submitRegistration(){try{user=(await api("register",{name:rn.value.trim(),phone:rp.value.trim(),password:rpass.value,referralCode:rr.value.trim()})).user;boot()}catch(e){message(e.message)}}
function boot(){auth.classList.add("hide");app.classList.remove("hide");member.textContent=user.full_name;navs();draw()}
function navs(){["nav","bottom"].forEach(function(id){document.getElementById(id).innerHTML=tabs.map(function(t){return '<button class="'+(page===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+(id==="bottom"?t[1]+"<br>":"")+t[2]+"</button>"}).join("")})}
function go(p){page=p;navs();draw()}
function ledgerRow(x){return '<tr><td>'+esc(x.posted_at||x.created_at)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.status)+'</td><td class="'+(x.direction==="credit"?"ledger-credit":"ledger-debit")+'">'+(x.direction==="debit"?"−":"+")+money(x.amount_ugx)+'</td></tr>'}
function stat(label,val){return '<div class="card stat">'+label+'<b>'+money(val)+'</b></div>'}
async function submitRequest(path,data){try{var r=await api(path,data);alert(r.message||"Request saved");draw()}catch(e){alert(e.message)}}
async function depositPrompt(){var amount=Number(prompt("Deposit amount in UGX (minimum 15000)","15000"));if(!Number.isSafeInteger(amount))return;var phone=prompt("MTN/Airtel phone number",user.phone_e164);if(!phone)return;var provider=prompt("Network: enter MTN or Airtel","MTN");if(!provider)return;submitRequest("deposit-request",{amount:amount,phone:phone,provider:provider.toLowerCase()})}
async function withdrawPrompt(){var amount=Number(prompt("Gross withdrawal amount in UGX (minimum 5000). 15% deduction; net payout is 85%.","5000"));if(!Number.isSafeInteger(amount))return;alert("Estimated net payout: "+money(Math.floor(amount*.85)));var phone=prompt("MTN/Airtel phone number",user.phone_e164);if(!phone)return;var provider=prompt("Network: enter MTN or Airtel","MTN");if(!provider)return;submitRequest("withdraw-request",{amount:amount,phone:phone,provider:provider.toLowerCase()})}
async function purchasePrompt(id){var phone=prompt("MTN/Airtel phone number",user.phone_e164);if(!phone)return;var provider=prompt("Network: enter MTN or Airtel","MTN");if(!provider)return;submitRequest("purchase-request",{productId:id,phone:phone,provider:provider.toLowerCase()})}
function disabledAction(s){alert(s+" is not enabled yet. A real-money service requires verified payment integration and approved terms.")}
async function draw(){var s=document.getElementById("screen");
if(page==="home"){var d=await api("dashboard"),v=d.summary;s.innerHTML='<h1>Welcome back, '+esc(user.full_name.split(" ")[0])+'!</h1><p class="muted">Your account overview · live ledger</p><div class="warn">Balances use posted ledger entries only. Your account balance reflects recorded transactions. Deposit and withdrawal requests remain pending until payment processing is connected.</div><div class="stats">'+stat("Welcome bonus",v.welcome_bonus)+stat("Account balance",v.balance)+stat("Total deposited",v.total_deposited)+stat("Today’s earnings",v.today_earnings)+stat("Referral earnings",v.referral_earnings)+stat("Total earned",v.total_earned)+stat("Total withdrawn",v.total_withdrawn)+'</div><div class="actions"><button class="btn primary" data-action="Deposit" onclick="depositPrompt()">Deposit</button><button class="btn" data-action="Withdraw" onclick="withdrawPrompt()">Withdraw</button><button class="btn light" onclick="go(&quot;referrals&quot;)">Invite</button></div><h3>Invitation link</h3><div class="invite"><span>'+location.origin+'/?ref='+esc(user.referral_code)+'</span><button class="btn light" onclick="copyInvite()">Copy</button></div><h3>Active products</h3><div class="card muted">Your purchased machines will appear here after purchase confirmation.</div>'}
if(page==="products"){var d=await api("products");s.innerHTML='<h1>Products</h1><p class="muted">Explore our machine packages and compare their listed prices, daily income figures, and durations.</p><div class="products">'+(d.products.length?d.products.map(function(p){var total=Number(p.daily_figure_ugx||0)*Number(p.duration_days||0);return '<article class="card"><div class="machine">'+(p.image_path?'<img src="'+esc(p.image_path)+'" alt="'+esc(p.name)+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">':'⚙')+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+money(p.principal_ugx)+'</div><p>Daily figure: <b>'+money(p.daily_figure_ugx)+'</b></p><p>Duration: <b>'+Number(p.duration_days||0)+' days</b></p><p>Simple sum: <b>'+money(total)+'</b></p><p class="muted small">Listed daily income is an estimate; actual returns depend on the approved product terms.</p><button class="btn primary wide" data-action="Purchase" onclick="purchasePrompt('+p.id+')">Request purchase</button></article>'}).join(""):"<p class='muted'>No products found.</p>")+'</div>'}
if(page==="referrals"){var d=await api("referrals");s.innerHTML='<h1>Referrals</h1><p class="muted">Your unique code: <b>'+esc(user.referral_code)+'</b></p><div class="invite"><span>'+location.origin+'/?ref='+esc(user.referral_code)+'</span><button class="btn light" onclick="copyInvite()">Copy</button></div><div class="stats"><div class="card stat">People referred<b>'+Number(d.count||0)+'</b></div><div class="card stat">Verified deposits<b>'+money(d.total_verified_deposits||0)+'</b></div></div><h3>Referred friends</h3><p class="muted">Phone numbers are masked for privacy.</p><div class="table"><table><tr><th>Telephone</th><th>Joined</th><th>Verified deposits</th></tr>'+(d.referrals.length?d.referrals.map(function(r){return '<tr><td>'+esc(r.phone_masked)+'</td><td>'+esc(r.created_at)+'</td><td>'+money(r.verified_deposits)+'</td></tr>'}).join(""):'<tr><td colspan="3">No referred users yet.</td></tr>')+'</table></div>'}
if(page==="account"){var d=await api("dashboard");var l=await api("ledger");var q=await api("requests");s.innerHTML='<h1>Account</h1><div class="card"><h3>'+esc(user.full_name)+'</h3><p class="muted">Account number: '+esc(user.phone_e164)+'</p><p>Balance: <b>'+money(d.summary.balance)+'</b></p><p>Total earned: <b>'+money(d.summary.total_earned)+'</b></p><h3>Change password</h3><label>Current password<input id="currentPassword" type="password" autocomplete="current-password"></label><label>New password<input id="newPassword" type="password" autocomplete="new-password"></label><button class="btn primary" onclick="changePassword()">Update password</button><p id="accountMsg" class="muted"></p><hr><button class="btn" onclick="logout()">Log out</button></div><h3>Payment and purchase requests</h3><p class="muted">Pending requests are not confirmed payments or completed payouts.</p><div id="requestRows" class="request-list"></div><h3>Transaction ledger</h3><p class="muted">Only posted entries affect balances.</p><div id="ledgerRows" class="table"></div>';var requestRows=document.getElementById("requestRows");requestRows.innerHTML=q.requests.length?q.requests.map(function(x){return '<div class="card"><b>'+esc(x.label)+'</b><p class="muted">'+esc(x.created_at)+' · Reference: '+esc(x.id)+'</p><span class="pill">'+esc(x.status)+'</span>'+(x.amount_ugx?' · '+money(x.amount_ugx):'')+'</div>'}).join(""):'<p class="muted">No requests submitted yet.</p>';var rows=document.getElementById("ledgerRows");if(l.entries.length){rows.innerHTML='<table><tr><th>Date</th><th>Description</th><th>Status</th><th>Amount</th></tr>'+l.entries.map(ledgerRow).join("")+'</table>'}else{rows.textContent="No transaction entries yet."}}}
async function copyInvite(){var l=location.origin+"/?ref="+user.referral_code;try{await navigator.clipboard.writeText(l);alert("Copied")}catch(e){prompt("Copy invite link",l)}}
async function changePassword(){var msg=document.getElementById("accountMsg");msg.textContent="";try{await api("change-password",{currentPassword:document.getElementById("currentPassword").value,newPassword:document.getElementById("newPassword").value});msg.textContent="Password changed. Other sessions have been signed out.";document.getElementById("currentPassword").value="";document.getElementById("newPassword").value=""}catch(e){msg.textContent=e.message}}
async function logout(){try{await fetch("/api/logout",{method:"POST",credentials:"same-origin"})}finally{location.reload()}}
(function(){var r=new URLSearchParams(location.search).get("ref");if(r)rr.value=r;api("me").then(function(d){user=d.user;boot()}).catch(function(){})})();
</script></body></html>
