<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b4e"><title>Peak Holdings</title><style>
:root{--n:#102b4e;--g:#16845b;--gold:#d8a84e;--mut:#718096;--line:#e7edf3;--bg:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#182638}button,input{font:inherit}button{cursor:pointer;border:0}.hide{display:none!important}.wrap{max-width:1100px;margin:auto;padding:16px}.brand{font-weight:850;color:var(--n);font-size:21px;display:flex;gap:10px;align-items:center}.logo{background:linear-gradient(135deg,var(--n),var(--g));color:white;border-radius:12px;padding:9px 13px}.panel,.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.auth{max-width:420px;margin:7vh auto}h1{font-size:25px;color:var(--n);margin:18px 0 4px}label{display:block;font-size:13px;color:#42556b;margin:12px 0}input{display:block;width:100%;padding:12px;border:1px solid #dce4ed;border-radius:10px;margin-top:5px}.btn{padding:11px 16px;border-radius:10px;font-weight:750}.primary{background:var(--n);color:white}.light{background:#eaf3ef;color:var(--g)}.wide{width:100%;margin-top:8px}.muted{color:var(--mut);font-size:13px}.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 18px}.nav{display:flex;gap:7px;background:white;padding:7px;border:1px solid var(--line);border-radius:13px}.nav button{background:transparent;color:var(--mut);padding:10px 16px;border-radius:9px;font-weight:700}.nav .on{background:var(--n);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{color:var(--mut);font-size:12px}.stat b{display:block;color:var(--n);font-size:22px;margin:5px 0}.actions{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}.invite{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#eff8f3;padding:13px;border-radius:12px;color:var(--g);overflow-wrap:anywhere}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.machine{height:105px;background:linear-gradient(135deg,#eaf1f9,#e8f5ee);border-radius:12px;display:grid;place-items:center;color:var(--n);font-size:35px}.price{font-size:20px;font-weight:850;color:var(--n);margin:7px 0}.table{overflow:auto;background:white;border-radius:12px;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:500px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--mut)}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.levels b{display:block;color:var(--g);font-size:22px}.warn{background:#fff6e3;border:1px solid #ead8ad;color:#77581d;padding:11px;border-radius:11px;font-size:12px;margin:12px 0}.bottom{display:none}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}.nav{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:white;border-top:1px solid var(--line);padding:8px}.bottom button{background:white;color:var(--mut);font-size:12px}.bottom .on{color:var(--g)}main{padding-bottom:75px}.levels{grid-template-columns:1fr}.wrap{padding:12px}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><span class="logo">P</span> PEAK HOLDINGS</div><span id="member" class="muted"></span></header>
<section id="auth" class="panel auth"><div id="login"><h1>Welcome back</h1><p class="muted">Log in with your registered phone.</p><label>Telephone (+country code)<input id="lp" type="tel" placeholder="+2567…"></label><label>Password<input id="lpass" type="password" autocomplete="current-password"></label><button class="btn primary wide" onclick="login()">Log in</button><p class="muted">New here? <a href="#" onclick="toggleAuth();return false">Create account</a></p></div><div id="register" class="hide"><h1>Create account</h1><label>Full name<input id="rn"></label><label>Telephone (+country code)<input id="rp" type="tel" placeholder="+2567…"></label><label>Password (10+ characters)<input id="rpass" type="password" autocomplete="new-password"></label><label>Referral code (optional)<input id="rr"></label><button class="btn primary wide" onclick="register()">Register</button><p class="muted">Already registered? <a href="#" onclick="toggleAuth();return false">Log in</a></p></div><p id="msg" class="muted"></p></section>
<div id="app" class="hide"><nav class="nav" id="nav"></nav><main id="screen"></main></div></div><nav class="bottom" id="bottom"></nav>
<script>
var tabs=[["home","⌂","Home"],["products","▦","Products"],["referrals","♧","Referrals"],["account","◉","Account"]],page="home",user=null;
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "UGX "+Number(n||0).toLocaleString("en-US")}
function message(t){document.getElementById("msg").textContent=t}
function toggleAuth(){login.classList.toggle("hide");register.classList.toggle("hide");message("")}
async function api(path,data){var r=await fetch("/api/"+path,{method:data?"POST":"GET",headers:data?{"content-type":"application/json"}:{},body:data?JSON.stringify(data):undefined,credentials:"same-origin"});var j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function login(){try{user=(await api("login",{phone:lp.value.trim(),password:lpass.value})).user;boot()}catch(e){message(e.message)}}
async function register(){try{user=(await api("register",{name:rn.value.trim(),phone:rp.value.trim(),password:rpass.value,referralCode:rr.value.trim()})).user;boot()}catch(e){message(e.message)}}
function boot(){auth.classList.add("hide");app.classList.remove("hide");member.textContent=user.full_name;navs();draw()}
function navs(){["nav","bottom"].forEach(function(id){document.getElementById(id).innerHTML=tabs.map(function(t){return '<button class="'+(page===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+(id==="bottom"?t[1]+"<br>":"")+t[2]+"</button>"}).join("")})}
function go(p){page=p;navs();draw()}
function stat(label,val){return '<div class="card stat">'+label+'<b>'+money(val)+'</b></div>'}
function disabledAction(s){alert(s+" is not enabled yet. A real-money service requires verified MarzPay integration and approved terms.")}
async function draw(){var s=document.getElementById("screen");
if(page==="home"){s.innerHTML='<h1>Welcome back, '+esc(user.full_name.split(" ")[0])+'!</h1><p class="muted">Your account overview</p><div class="warn">Your live ledger is currently UGX 0. No bonus, deposit, or investment return has been credited.</div><div class="stats">'+stat("Account balance",0)+stat("Total deposited",0)+stat("Today’s earnings",0)+stat("Referral earnings",0)+stat("Total earned",0)+stat("Total withdrawn",0)+'</div><div class="actions"><button class="btn primary" onclick="disabledAction(\'Deposit\')">Deposit</button><button class="btn" onclick="disabledAction(\'Withdraw\')">Withdraw</button><button class="btn light" onclick="go(\'referrals\')">Invite</button></div><h3>Invitation link</h3><div class="invite"><span>'+location.origin+'/?ref='+esc(user.referral_code)+'</span><button class="btn light" onclick="copyInvite()">Copy</button></div><h3>Active products</h3><div class="card muted">No active products.</div>'}
if(page==="products"){var d=await api("products");s.innerHTML='<h1>Products</h1><p class="muted">Catalogue awaits review and approval of the product terms.</p><div class="products">'+(d.products.length?d.products.map(function(p){return '<article class="card"><div class="machine">▣</div><h3>'+esc(p.name)+'</h3><div class="price">'+money(p.principal_ugx)+'</div><p class="muted">Status: '+esc(p.terms_status)+'</p><button class="btn primary wide" onclick="disabledAction(\'Purchase\')">Details</button></article>'}).join(""):"<p class='muted'>No approved products published yet.</p>")+'</div>'}
if(page==="referrals"){s.innerHTML='<h1>Referrals</h1><p class="muted">Your unique code: <b>'+esc(user.referral_code)+'</b></p><div class="invite">'+location.origin+'/?ref='+esc(user.referral_code)+' <button class="btn light" onclick="copyInvite()">Copy</button></div><h3>Referral levels</h3><div class="levels"><div class="card">Level 1<b>Pending approval</b></div><div class="card">Level 2<b>Pending approval</b></div><div class="card">Level 3<b>Pending approval</b></div></div><h3>Referred friends</h3><div class="table"><table><tr><th>Telephone</th><th>Date/time</th><th>Verified deposit</th></tr><tr><td colspan="3">No referral records yet.</td></tr></table></div>'}
if(page==="account"){s.innerHTML='<h1>Account</h1><div class="card"><h3>'+esc(user.full_name)+'</h3><p class="muted">Account number: '+esc(user.phone_e164)+'</p><p>Balance: <b>'+money(0)+'</b></p><p>Total earnings: <b>'+money(0)+'</b></p><button class="btn" onclick="disabledAction(\'Change password\')">Change password</button> <button class="btn" onclick="disabledAction(\'Install app\')">Install app</button><p><button class="btn" onclick="disabledAction(\'Telegram support\')">Telegram support</button></p><button class="btn" onclick="logout()">Log out</button></div><h3>Transaction ledger</h3><div class="card muted">No posted transactions.</div>'}}
async function copyInvite(){var l=location.origin+"/?ref="+user.referral_code;try{await navigator.clipboard.writeText(l);alert("Copied")}catch(e){prompt("Copy invite link",l)}}
async function logout(){await fetch("/api/logout",{method:"POST",credentials:"same-origin"});location.reload()}
(function(){var r=new URLSearchParams(location.search).get("ref");if(r)rr.value=r;api("me").then(function(d){user=d.user;boot()}).catch(function(){})})();
</script></body></html>
