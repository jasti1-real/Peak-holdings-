.toast-host{position:fixed;left:16px;right:16px;bottom:90px;z-index:1500;display:flex;justify-content:center;pointer-events:none}.app-toast{max-width:420px;width:max-content;background:#102b4e;color:#fff;padding:13px 18px;border-radius:14px;box-shadow:0 12px 32px #07182c45;display:flex;gap:10px;align-items:center;font-weight:650;font-size:14px;animation:popIn .18s ease-out}.app-toast.error{background:#8d3029}.app-toast.success{background:#116b4f}.app-toast button{pointer-events:auto;border:0;background:transparent;color:#fff;font-size:19px;padding:0 0 0 8px}.copy-field{display:block;width:100%;padding:12px;border:1px solid #d9e2ec;border-radius:12px;word-break:break-all;background:#f7fafc;color:#255747;font-size:13px;line-height:1.5}
.account-hero{background:linear-gradient(130deg,#102b4e,#147b59);border-radius:22px;padding:23px;color:white;margin-bottom:16px;box-shadow:0 12px 28px #0b2a481a}.account-hero .eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:800;opacity:.78}.account-hero h2{color:#fff;margin:10px 0 5px;font-size:24px}.account-hero p{color:#e5f2ed;margin:0;font-size:13px}.account-balance{font-size:30px;font-weight:850;letter-spacing:-.5px;margin:19px 0 4px}.account-quickstats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}.account-stat{background:#fff;border:1px solid #e6edf2;border-radius:17px;padding:16px;min-width:0}.account-stat .label{font-size:12px;color:#788698;margin-bottom:7px}.account-stat .value{font-size:17px;font-weight:800;color:#172b43;overflow-wrap:anywhere}.account-section{background:#fff;border:1px solid #e6edf2;border-radius:20px;padding:18px;margin:14px 0}.account-section h3{margin:0 0 8px}.account-section .section-sub{font-size:13px;color:#7b8796;line-height:1.5;margin:0 0 16px}.account-label{font-size:13px;font-weight:700;color:#435367;display:block;margin:13px 0 6px}.account-section input{width:100%;box-sizing:border-box;border:1px solid #dfe7ee;border-radius:12px;padding:13px;font-size:15px}.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.account-actions .btn{margin:0}.account-request{padding:14px;border:1px solid #e6edf2;border-radius:14px;margin:10px 0;background:#fbfcfd}.account-request-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.account-request-title{font-weight:750;color:#20334b}.account-request-meta{font-size:12px;color:#7b8796;margin:8px 0;overflow-wrap:anywhere}.account-status{display:inline-block;padding:5px 9px;border-radius:99px;background:#fff4d7;color:#7b5c1c;font-size:11px;font-weight:800;text-transform:capitalize}.account-ledger{overflow-x:auto;border:1px solid #e6edf2;border-radius:14px}.account-ledger table{min-width:520px}.account-empty{padding:20px 12px;text-align:center;color:#7b8796;background:#f8fafc;border-radius:14px;font-size:13px}.account-section .btn.primary{width:100%;padding:13px;border-radius:12px}.account-logout{background:#fff1ef!important;color:#a53d35!important;border:1px solid #f5d5d1!important}@media(min-width:600px){.account-quickstats{grid-template-columns:repeat(3,1fr)}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}}
.auth #msg{padding:10px 12px;border-radius:10px;line-height:1.45}.auth #msg:empty{display:none}.auth #msg:not(:empty){background:#fff0ee;color:#96382f}.auth .auth-success{background:#eaf7f0!important;color:#176849!important}.auth button:disabled{opacity:.6;cursor:wait}.auth input:focus{outline:2px solid #b8d8cc;border-color:#16845b}

</style></head><body><div class="wrap"><header class="header"><div class="brand"><span class="logo">P</span> PEAK HOLDINGS</div><span id="member" class="muted"></span></header>
<section id="auth" class="panel auth"><div id="login"><h1>Welcome back</h1><p class="muted">Log in with your registered phone.</p><label>Telephone number<input id="lp" type="tel" inputmode="tel" placeholder="0771234567 or +256771234567"></label><label>Password<input id="lpass" type="password" autocomplete="current-password"></label><button class="btn primary wide" onclick="submitLogin()">Log in</button><p class="muted">New here? <a href="#" onclick="toggleAuth();return false">Create account</a></p></div><div id="register" class="hide"><h1>Create account</h1><label>Full name<input id="rn"></label><label>Telephone number<input id="rp" type="tel" inputmode="tel" placeholder="0771234567 or +256771234567"></label><label>Password (10+ characters)<input id="rpass" type="password" autocomplete="new-password"></label><label>Referral code (optional)<input id="rr"></label><button class="btn primary wide" onclick="submitRegistration()">Register</button><p class="muted">Already registered? <a href="#" onclick="toggleAuth();return false">Log in</a></p></div><p id="msg" class="muted"></p></section>
<div id="app" class="hide"><nav class="nav" id="nav"></nav><main id="screen"></main></div></div><nav class="bottom" id="bottom"></nav><div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div><div id="actionModal" class="modal-backdrop hide" role="dialog" aria-modal="true" aria-labelledby="actionTitle"><section class="modal-card"><div class="modal-head"><button class="modal-close" type="button" onclick="closeActionModal()" aria-label="Close">×</button><div class="modal-brand">PEAK HOLDINGS</div><h2 id="actionTitle">Request</h2><p id="actionSubtitle">Complete the details below.</p></div><form id="actionForm" class="modal-body"><div id="actionFields"></div><div id="actionInfo" class="modal-info"></div><div id="actionError" class="modal-error hide" role="alert"></div><div class="modal-buttons"><button class="modal-cancel" type="button" onclick="closeActionModal()">Cancel</button><button id="actionSubmit" class="modal-submit" type="submit">Continue</button></div></form></section></div>
<script>
var tabs=[["home","⌂","Home"],["products","▦","Products"],["referrals","♧","Referrals"],["account","◉","Account"]],page="home",user=null;
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return "UGX "+Number(n||0).toLocaleString("en-US")}
function message(t,success){var m=document.getElementById("msg");m.textContent=t||"";m.classList.toggle("auth-success",!!success)}
function toggleAuth(){var loginPanel=document.getElementById("login");var registerPanel=document.getElementById("register");loginPanel.classList.toggle("hide");registerPanel.classList.toggle("hide");message("");}
async function api(path,data){var r=await fetch("/api/"+path,{method:data?"POST":"GET",headers:data?{"content-type":"application/json"}:{},body:data?JSON.stringify(data):undefined,credentials:"same-origin"});var j;try{j=await r.json()}catch(_){throw Error("The server returned an unexpected response. Please try again.")}if(!r.ok)throw Error(j.error||"Request failed");return j}
async function submitLogin(){var btn=document.querySelector("#login button");if(btn.disabled)return;var phone=lp.value.trim(),password=lpass.value;if(!phone||!password){message("Enter your telephone number and password.");return}btn.disabled=true;btn.textContent="Logging in…";message("");try{user=(await api("login",{phone:phone,password:password})).user;boot()}catch(e){message(e.message||"Login failed. Please try again.")}finally{btn.disabled=false;btn.textContent="Log in"}}
async function submitRegistration(){var btn=document.querySelector("#register button");if(btn.disabled)return;var name=rn.value.trim(),phone=rp.value.trim(),password=rpass.value,referralCode=rr.value.trim();if(name.length<2){message("Enter your full name.");return}if(!phone){message("Enter your telephone number.");return}if(password.length<10){message("Choose a password with at least 10 characters.");return}btn.disabled=true;btn.textContent="Creating account…";message("");try{user=(await api("register",{name:name,phone:phone,password:password,referralCode:referralCode})).user;boot()}catch(e){message(e.message||"Registration failed. Please try again.")}finally{btn.disabled=false;btn.textContent="Register"}}
document.querySelectorAll("#login input").forEach(function(input){input.addEventListener("keydown",function(e){if(e.key==="Enter")submitLogin()})});
document.querySelectorAll("#register input").forEach(function(input){input.addEventListener("keydown",function(e){if(e.key==="Enter")submitRegistration()})});
function boot(){auth.classList.add("hide");app.classList.remove("hide");member.textContent=user.full_name;navs();draw()}
function navs(){["nav","bottom"].forEach(function(id){document.getElementById(id).innerHTML=tabs.map(function(t){return '<button class="'+(page===t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+(id==="bottom"?t[1]+"<br>":"")+t[2]+"</button>"}).join("")})}
function go(p){page=p;navs();draw()}
function ledgerRow(x){return '<tr><td>'+esc(x.posted_at||x.created_at)+'</td><td>'+esc(x.description)+'</td><td>'+esc(x.status)+'</td><td class="'+(x.direction==="credit"?"ledger-credit":"ledger-debit")+'">'+(x.direction==="debit"?"−":"+")+money(x.amount_ugx)+'</td></tr>'}
function stat(label,val){return '<div class="card stat">'+label+'<b>'+money(val)+'</b></div>'}
var currentAction="",currentProductId=null;
function closeActionModal(){actionModal.classList.add("hide");}
function showActionModal(kind,productId){currentAction=kind;currentProductId=productId||null;actionError.classList.add("hide");actionError.textContent="";actionSubmit.disabled=false;actionSubmit.textContent="Continue";actionTitle.textContent={deposit:"Make a deposit",withdraw:"Request withdrawal",purchase:"Request machine"}[kind];actionSubtitle.textContent={deposit:"Add funds to your Peak Holdings account.",withdraw:"Request a payout to your mobile-money number.",purchase:"Start a request for this machine package."}[kind];var fields="";
if(kind==="deposit"){fields='<label>Deposit amount (UGX)<input id="actionAmount" type="number" min="15000" max="50000000" step="1000" value="15000" required></label>'}
if(kind==="withdraw"){fields='<label>Withdrawal amount (UGX)<input id="actionAmount" type="number" min="5000" max="50000000" step="1000" value="5000" required oninput="updateActionNet()"></label><p id="actionNet" class="net-preview">Estimated payout after 15% deduction: UGX 4,250</p>'}
if(kind==="purchase"){fields='<p><b>'+esc(String(productId||"Selected machine"))+'</b></p>'}
fields+='<label>Mobile-money number<input id="actionPhone" type="tel" inputmode="tel" value="'+esc(user.phone_e164)+'" placeholder="0771234567 or +256771234567" required></label><label>Mobile-money network<select id="actionProvider" required><option value="mtn">MTN Mobile Money</option><option value="airtel">Airtel Money</option></select></label>';
actionFields.innerHTML=fields;actionInfo.textContent=kind==="deposit"?"Minimum deposit UGX 15,000. This request is not a payment confirmation.":kind==="withdraw"?"Minimum withdrawal UGX 5,000. Requests are checked against your available balance and eligibility.":"First, complete a confirmed deposit of at least UGX 15,000. After that, you can request a machine that is available for purchase. This form does not charge money.";actionModal.classList.remove("hide");}
function updateActionNet(){var n=Number(document.getElementById("actionAmount").value||0);document.getElementById("actionNet").textContent="Estimated payout after 15% deduction: "+money(Math.floor(n*.85))}
async function sendActionRequest(){actionError.classList.add("hide");actionSubmit.disabled=true;actionSubmit.textContent="Submitting…";var data={phone:document.getElementById("actionPhone").value.trim(),provider:document.getElementById("actionProvider").value};var path="";
if(currentAction==="purchase"){path="purchase-request";data.productId=Number(currentProductId)}else{data.amount=Number(document.getElementById("actionAmount").value);path=currentAction==="deposit"?"deposit-request":"withdraw-request"}
try{var result=await api(path,data);actionInfo.textContent=result.message||"Your request has been recorded.";actionSubmit.textContent="Request saved";setTimeout(function(){closeActionModal();draw()},1600)}catch(e){actionError.textContent=e.message||"We could not submit the request. Please try again.";actionError.classList.remove("hide");actionSubmit.disabled=false;actionSubmit.textContent="Try again"}}
document.getElementById("actionForm").addEventListener("submit",function(ev){ev.preventDefault();sendActionRequest()});
function depositPrompt(){showActionModal("deposit")}
function withdrawPrompt(){showActionModal("withdraw")}
async function purchasePrompt(id){try{var d=await api("dashboard");if(Number(d.summary.total_deposited||0)<15000){showActionModal("purchase",id);actionTitle.textContent="Deposit required";actionSubtitle.textContent="Machines are purchased after a deposit of at least UGX 15,000.";actionFields.innerHTML="";actionInfo.textContent="Machines are purchased after a deposit of at least UGX 15,000.";actionSubmit.classList.add("hide");return}showActionModal("purchase",id)}catch(e){showActionModal("purchase",id)}}
function disabledAction(s){showToast(s+" is not enabled yet.","error")}
async function draw(){var s=document.getElementById("screen");
if(page==="home"){var d=await api("dashboard"),v=d.summary;s.innerHTML='<h1>Welcome back, '+esc(user.full_name.split(" ")[0])+'!</h1><p class="muted">Your account overview · live ledger</p><div class="warn">Balances use posted ledger entries only. Your account balance reflects recorded transactions. Deposit and withdrawal requests remain pending until payment processing is connected.</div><div class="stats">'+stat("Welcome bonus",v.welcome_bonus)+stat("Account balance",v.balance)+stat("Total deposited",v.total_deposited)+stat("Today’s earnings",v.today_earnings)+stat("Referral earnings",v.referral_earnings)+stat("Total earned",v.total_earned)+stat("Total withdrawn",v.total_withdrawn)+'</div><div class="actions"><button class="btn primary" data-action="Deposit" onclick="depositPrompt()">Deposit</button><button class="btn" data-action="Withdraw" onclick="withdrawPrompt()">Withdraw</button><button class="btn light" onclick="go(&quot;referrals&quot;)">Invite</button></div><h3>Invitation link</h3><div class="invite"><span>'+location.origin+'/?ref='+esc(user.referral_code)+'</span><button class="btn light" onclick="copyInvite()">Copy</button></div><h3>Active products</h3><div class="card muted">Your purchased machines will appear here after purchase confirmation.</div>'}
if(page==="products"){var d=await api("products");s.innerHTML='<h1>Products</h1><p class="muted">Explore our machine packages and compare their listed prices, daily income figures, and durations.</p><div class="products">'+(d.products.length?d.products.map(function(p){var total=Number(p.daily_figure_ugx||0)*Number(p.duration_days||0);return '<article class="card"><div class="machine">'+(p.image_path?'<img src="'+esc(p.image_path)+'" alt="'+esc(p.name)+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px">':'⚙')+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+money(p.principal_ugx)+'</div><p>Daily figure: <b>'+money(p.daily_figure_ugx)+'</b></p><p>Duration: <b>'+Number(p.duration_days||0)+' days</b></p><p>Simple sum: <b>'+money(total)+'</b></p><p class="muted small">Listed daily income is an estimate; actual returns depend on the approved product terms.</p><button class="btn primary wide" data-action="Purchase" onclick="purchasePrompt('+p.id+')">Request purchase</button></article>'}).join(""):"<p class='muted'>No products found.</p>")+'</div>'}
if(page==="referrals"){var d=await api("referrals");s.innerHTML='<h1>Referrals</h1><p class="muted">Your unique code: <b>'+esc(user.referral_code)+'</b></p><div class="invite"><span>'+location.origin+'/?ref='+esc(user.referral_code)+'</span><button class="btn light" onclick="copyInvite()">Copy</button></div><div class="stats"><div class="card stat">People referred<b>'+Number(d.count||0)+'</b></div><div class="card stat">Verified deposits<b>'+money(d.total_verified_deposits||0)+'</b></div></div><h3>Referred friends</h3><p class="muted">Phone numbers are masked for privacy.</p><div class="table"><table><tr><th>Telephone</th><th>Joined</th><th>Verified deposits</th></tr>'+(d.referrals.length?d.referrals.map(function(r){return '<tr><td>'+esc(r.phone_masked)+'</td><td>'+esc(r.created_at)+'</td><td>'+money(r.verified_deposits)+'</td></tr>'}).join(""):'<tr><td colspan="3">No referred users yet.</td></tr>')+'</table></div>'}
if(page==="account"){var d=await api("dashboard");var l=await api("ledger");var q=await api("requests");s.innerHTML='<h1>My Account</h1><section class="account-hero"><div class="eyebrow">PEAK HOLDINGS · MEMBER ACCOUNT</div><h2>'+esc(user.full_name)+'</h2><p>'+esc(user.phone_e164)+'</p><div class="account-balance">'+money(d.summary.balance)+'</div><p>Available account balance</p></section><div class="account-quickstats"><div class="account-stat"><div class="label">Total deposited</div><div class="value">'+money(d.summary.total_deposited)+'</div></div><div class="account-stat"><div class="label">Total earned</div><div class="value">'+money(d.summary.total_earned)+'</div></div><div class="account-stat"><div class="label">Referral earnings</div><div class="value">'+money(d.summary.referral_earnings)+'</div></div></div><div class="account-grid"><section class="account-section"><h3>Security</h3><p class="section-sub">Manage your password and account security.</p><p><a href="#changePasswordForm" onclick="event.preventDefault();document.getElementById(&quot;changePasswordForm&quot;).classList.toggle(&quot;hide&quot;);document.getElementById(&quot;currentPassword&quot;).focus();" class="change-password-link">Change password →</a></p><div id="changePasswordForm" class="hide"><label class="account-label" for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" placeholder="Enter current password"><label class="account-label" for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Choose a new password"><button class="btn primary" onclick="changePassword()">Update password</button><p id="accountMsg" class="muted" role="status"></p></div><div class="account-actions"><button class="btn account-logout" onclick="logout()">Log out</button></div></section><section class="account-section"><h3>Requests</h3><p class="section-sub">Track the status of your deposi
